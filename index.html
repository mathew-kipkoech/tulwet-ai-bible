<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TULWET MERGE + SASA</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;height:100vh;overflow:hidden}
.h{background:#166534;padding:8px;display:flex;justify-content:space-between;flex-wrap:wrap}
video{width:100%;height:55vh;object-fit:cover;background:#111}
.box{background:#14532d;padding:10px;margin:8px;border-radius:10px;max-height:30vh;overflow:auto}
.b{padding:10px 15px;border:none;border-radius:20px;font-weight:bold;margin:3px}
.sasa{background:#16a34a;color:#fff;border:2px solid #fff}
.play{background:#facc15}
</style>
</head>
<body>
<div class="h"><b>⛰️ TULWET MERGE + SASA</b><span>🌍 12,847 🟢 127</span></div>
<video id="v" autoplay loop muted playsinline src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"></video>
<div class="box" id="box">✅ MERGED READY!<br>📖 Healing, Fees, Fear<br>🎭 Exodus Play - Moses & Red Sea<br>📤 SASA Share ready</div>
<div style="padding:8px;display:flex;flex-wrap:wrap">
<button class="b play" onclick="document.getElementById('v').play()">▶️ PLAY</button>
<button class="b sasa" onclick="shareSasa()">📤 SHARE TO SASA APP ONLY</button>
<button class="b" style="background:#fff" onclick="location.href='sasa://open'">🚀 OPEN SASA</button>
</div>
<script>
function shareSasa(){
let data={video:document.getElementById('v').src, text:document.getElementById('box').innerText, time:Date.now()};
localStorage.setItem('tulwet_to_sasa',JSON.stringify(data));
location.href='sasa://share?video='+encodeURIComponent(data.video);
setTimeout(()=>{alert('COPIED FOR SASA:\n'+data.video+'\n'+data.text.slice(0,100));},600);
}
</script>
</body>
</html>
