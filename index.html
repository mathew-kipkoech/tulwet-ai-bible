<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TULWET LIVE CALL + VOICE</title><style>body{margin:0;background:#000;color:#fff;font-family:Arial;text-align:center}header{background:#166534;padding:8px;display:flex;justify-content:space-between;font-size:12px}.box{max-width:500px;margin:auto;background:#111;border-radius:16px;overflow:hidden;position:relative}.videos{position:relative;width:100%;aspect-ratio:9/16;background:#222}video{position:absolute;width:100%;height:100%;object-fit:cover;top:0;left:0}#myVid{width:35%;height:25%;top:10px;right:10px;left:auto;border:2px solid #facc15;border-radius:12px;z-index:5}.controls{position:absolute;bottom:80px;left:0;right:0;display:flex;justify-content:center;gap:12px;z-index:10}.ctrl{width:50px;height:50px;border-radius:50%;border:none;font-size:20px}.red{background:#ff2a2a;color:#fff}.green{background:#00c853;color:#fff}.gold{background:#facc15}.tabs{display:flex;gap:4px;padding:6px;overflow:auto}.tab{padding:5px 10px;border-radius:20px;background:#222;color:#fff;border:none;font-size:11px}.tab.active{background:#facc15;color:#000}.panel{padding:8px;text-align:left;font-size:12px;min-height:90px;background:#000c}input,textarea{width:90%;padding:9px;border-radius:10px;border:none;margin:3px}.b{padding:8px 12px;border-radius:20px;border:none;font-weight:bold;margin:2px;font-size:11px}.sasa{background:#16a34a;color:#fff}</style></head><body>
<header><b>⛰️ TULWET LIVE</b><span>📹 Video Call + 🎤 Voice</span></header>
<div class="box">
<div style="display:flex;gap:4px;padding:4px"><textarea id="prob" style="flex:1" rows="2" placeholder="🎤 Tap mic to speak..."></textarea><button class="b gold" onclick="voiceTake()" style="height:40px">🎤</button></div>
<div class="videos">
<video id="jesusVid" autoplay loop muted playsinline poster="https://i.imgur.com/8Km9tLL.jpg" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"></video>
<video id="myVid" autoplay muted playsinline></video>
<div class="controls"><button class="ctrl red" onclick="endCall()">✕</button><button class="ctrl gold" onclick="startLiveCall()">📞</button><button class="ctrl green" onclick="voiceTake()">🎤</button></div>
<div style="position:absolute;top:10px;left:10px;background:#0008;padding:4px 8px;border-radius:12px;font-size:10px;z-index:6">🟢 LIVE CALL READY</div>
</div>
<div class="tabs">
<button class="tab active" onclick="setM('jesus',this)">✝️ AI Jesus</button>
<button class="tab" onclick="setM('smart',this)">🧠 Smart Therapy</button>
<button class="tab" onclick="setM('live',this)">📹 Live Call</button>
<button class="tab" onclick="setM('voice',this)">🎤 Voice</button>
</div>
<div id="pan" class="panel">📹 LIVE VIDEO CALL + 🎤 VOICE TAKING READY<br>1. Tap 📞 to start YOUR camera (live call)<br>2. Tap 🎤 to speak Kalenjin/Swahili - I type it<br>3. Then tap SMART CHAT or AI JESUS<br>Goal: <span id="gT">1/30</span></div>
<div style="padding:4px"><button class="b gold" onclick="runJesus()">▶️ AI JESUS</button><button class="b" style="background:#7c3aed;color:#fff" onclick="smartChat()">🧠 SMART</button><button class="b sasa" onclick="shareSasa()">📤 SASA</button></div>
</div>
<script>
let mode='jesus',goal=parseInt(localStorage.getItem('tulwet_goal')||'1');gT.innerText=goal+'/30';
function setM(m,b){mode=m;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(m=='live')pan.innerHTML='📹 LIVE CALL: Your face bottom-right, Jesus top. Like WhatsApp video call. Tap 📞 to start camera.';if(m=='voice')pan.innerHTML='🎤 VOICE TAKING: Tap 🎤 mic, speak: Niko mgonjwa, Niko na hofu, Fees... I auto type and translate.';if(m=='jesus')pan.innerHTML='✝️ AI JESUS video call mode';if(m=='smart')pan.innerHTML='🧠 Smart Therapy with voice + live';}
async function startLiveCall(){try{let s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true});myVid.srcObject=s;pan.innerHTML='✅ LIVE CALL CONNECTED! Your camera ON. Jesus video playing. Talk now 🎤';jesusVid.play();}catch(e){pan.innerHTML='❌ Camera blocked: '+e.message+' - Allow camera permission';}}
function endCall(){if(myVid.srcObject){myVid.srcObject.getTracks().forEach(t=>t.stop());myVid.srcObject=null;}pan.innerHTML='🔴 CALL ENDED';}
function voiceTake(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){pan.innerHTML='Use Chrome for voice';return;}let r=new SR();r.lang='sw-KE';r.start();pan.innerHTML='🎧 Listening... Sema sasa: Niko mgonjwa / hofu / fees';r.onresult=e=>{let txt=e.results[0][0].transcript;prob.value=txt;pan.innerHTML='🎤 Heard: "'+txt+'"<br>Now tap SMART CHAT or AI JESUS';smartChat();};r.onerror=e=>pan.innerHTML='Voice error: '+e.error;}
async function runJesus(){let t=prob.value||'Mathew 7:7';let verse='Mathew 7:7';let mp={mgonjwa:'Isaiah 53:5',hofu:'Isaiah 41:10',fees:'Philippians 4:19',stress:'Matthew 11:28'};for(let k in mp)if(t.toLowerCase().includes(k))verse=mp[k];let bib=await fetch('https://bible-api.com/'+encodeURIComponent(verse)+'?translation=kjv').then(r=>r.json()).catch(()=>({text:'Ask and it shall be given',reference:verse}));pan.innerHTML='📖 '+bib.reference+': '+bib.text.slice(0,200)+'<br>🗣️ AI Jesus speaking your language...';speechSynthesis.speak(new SpeechSynthesisUtterance(bib.text.slice(0,180)));jesusVid.play();goal++;localStorage.setItem('tulwet_goal',goal);gT.innerText=goal+'/30';}
async function smartChat(){let uT=prob.value||'Niko na stress';pan.innerHTML='🧠 Smart thinking...';let hist=localStorage.getItem('tulwet_hist')||'';let prompt=`You are Tulwet Smart Therapist, warm, CBT + Bible, speak ${/^[a-z ]+$/i.test(uT)?'English':'Swahili'}. Empathy + verse + 1 step. Max 120 words. User: ${uT} History: ${hist.slice(-400)}`;try{let reply=`Nimekuelewa: "${uT.slice(0,70)}". ${hist.includes('fees')?'Bado fees?':''} Pumzi 4-4-4. Soma ${uT.includes('hofu')?'Isaya 41:10 - Usiogope':'Mathayo 11:28'}. Hatua: Andika mtu 1 wa kuambia. Mungu yuko Tulwet na wewe.`;pan.innerHTML=`🧠 <b>Smart:</b> ${reply}`;speechSynthesis.speak(new SpeechSynthesisUtterance(reply.slice(0,200)));localStorage.setItem('tulwet_hist',hist+`\nU:${uT}\nA:${reply}`.slice(-2000));}catch(e){pan.innerHTML='Error '+e.message;}}
function shareSasa(){let d={myVideo:'live',jesusVideo:jesusVid.src,text:pan.innerText,prob:prob.value,mode:mode};localStorage.setItem('tulwet_to_sasa',JSON.stringify(d));alert('Shared LIVE CALL + VOICE to SASA!');location.href='sasa://share?mode=live';}
</script></body></html>
