
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TULWET FULL MERGE + SASA</title><style>body{margin:0;background:#000;color:#fff;font-family:Arial;text-align:center}#box{max-width:500px;margin:auto;background:#111;border-radius:18px;overflow:hidden;position:relative;aspect-ratio:9/16}video{width:100%;height:100%;object-fit:cover}.overlay{position:absolute;bottom:0;width:100%;background:linear-gradient(transparent,rgba(0,0,0,.95));padding:10px}.tabs{display:flex;gap:4px;overflow:auto}.tab{padding:5px 10px;border-radius:12px;background:#222;font-size:11px;white-space:nowrap}.tab.active{background:#facc15;color:#000}.b{padding:10px 12px;border-radius:14px;border:none;font-weight:bold;margin:3px}.sasa{background:#16a34a;color:#fff;border:2px solid #fff}textarea,input{width:92%;padding:10px;border-radius:10px;border:none;margin:4px}</style></head><body><h2 style="color:#16a34a">⛰️ TULWET FULL MERGE + SASA</h2><textarea id="prob" placeholder="Niko mgonjwa / Fees / Hofu / Ndoa"></textarea><div id="box"><video id="v" autoplay loop muted playsinline src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" poster="https://i.imgur.com/8Km9tLL.jpg"></video><div class="overlay"><div class="tabs"><div class="tab active" onclick="show('play')">🎭 Play</div><div class="tab" onclick="show('heal')">🩹 Heal</div><div class="tab" onclick="show('fees')">💰 Fees</div><div class="tab" onclick="show('fear')">😨 Fear</div><div class="tab" onclick="show('solver')">🧠 Solver</div></div><div id="txt" style="font-size:12px;margin:6px;background:rgba(22,101,52,.9);padding:8px;border-radius:8px;text-align:left;max-height:120px;overflow:auto">✅ MERGED READY!<br>🩹 Healing: Isaiah 53:5<br>💰 Fees: Philippians 4:19<br>😨 Fear: Isaiah 41:10<br>🎭 Exodus Play: Moses & Red Sea ready<br>📤 SASA Share ready</div><div><button class="b" style="background:gold" onclick="v.play()">▶️ PLAY</button><button class="b sasa" onclick="shareSasa()">📤 SHARE TO SASA ONLY</button><button class="b" style="background:#fff" onclick="location.href='sasa://open'">🚀 OPEN SASA</button></div><div style="margin-top:5px"><button class="b" style="background:#333;color:#fff;width:92%" onclick="solve()">🙏 PROBLEM -> VIDEO SERMON CALL</button></div></div></div><script>let cur='play';function show(t){cur=t;document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));event.target.classList.add('active');if(t=='heal')txt.innerHTML='🩹 HEALING: Isaiah 53:5 - But He was wounded for our transgressions... By His stripes we are healed!<br><i>Kalenjin: Aramunech...</i>';if(t=='fees')txt.innerHTML='💰 FEES/DENI: Philippians 4:19 - My God shall supply all your need...<br>🙏 Prayer for school fees & debts';if(t=='fear')txt.innerHTML='😨 FEAR/HOFU: Isaiah 41:10 - Fear not, for I am with you...<br>Usiogope, Mimi ni pamoja nawe';if(t=='play')txt.innerHTML='🎭 EXODUS PLAY - Moses Birth & Red Sea Crossing<br>Act 1: Baby in basket, Act 2: Burning bush, Act 3: Red Sea parted! Tap PLAY!';if(t=='solver')txt.innerHTML='🧠 SOLVER: Type problem above (mgonjwa, hofu, deni, ndoa) then tap PROBLEM -> SERMON';}function solve(){let p=prob.value.toLowerCase()||'mgonjwa';let map={mgonjwa:'Isaiah 53:5',hofu:'Isaiah 41:10',deni:'Philippians 4:19',fees:'Philippians 4:19',ndoa:'1Cor 13:7',sick:'Isaiah 53:5',fear:'Isaiah 41:10'};let verse='Matthew 7:7';for(let k in map)if(p.includes(k))verse=map[k];txt.innerHTML='🧠 SOLVED: '+p+' -> '+verse+'<br>Fetching sermon...';fetch('https://bible-api.com/'+encodeURIComponent(verse)+'?translation=kjv').then(r=>r.json()).then(d=>{txt.innerHTML='📖 '+d.reference+': '+d.text.slice(0,200)+'...<br>✅ Video call ready!';v.play();});}function shareSasa(){let data={video:v.src,text:txt.innerText,problem:prob.value,time:Date.now(),feature:cur};localStorage.setItem('tulwet_to_sasa',JSON.stringify(data));alert('📤 SHARED TO SASA!\nVideo: '+data.video.slice(0,60)+'\nFeature: '+cur+'\nIn SASA app use: localStorage.getItem(\"tulwet_to_sasa\")');location.href='sasa://share?feature='+cur;}</script></body></html>
